name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ALE ROMs ship inside ale-py, so there is nothing extra to download.
      - name: Install
        run: pip install -e ".[dev]"

      # The suite is CPU-only and runs in well under a minute; no markers to
      # skip, so a green run means every invariant held, including the ALE
      # end-to-end test and the Hydra composition of every ablation preset.
      - name: Run tests
        run: pytest -q
